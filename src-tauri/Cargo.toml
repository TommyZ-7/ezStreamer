[package]
name = "ezstreamer"
version = "0.1.0-preview01"
edition = "2021"
description = "Lightweight streamer for TopazChat (Windows-only, GStreamer)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ezstreamer-core = { path = "../ezstreamer-core" }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Windows-only capture + GStreamer. cfg-gated (not features) so
# `cargo test` / `cargo check` / `pnpm build` pass on any host;
# the full pipeline compiles on Windows / windows-msvc check.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
  "implement",
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
