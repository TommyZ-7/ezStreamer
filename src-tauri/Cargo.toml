[package]
name = "ezstreamer"
version = "0.1.0-preview03"
edition = "2021"
description = "Lightweight streamer for TopazChat (GStreamer; Windows + Linux/Flatpak)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ezstreamer-core = { path = "../ezstreamer-core" }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Platform capture + GStreamer. cfg-gated (not features) so
# `cargo test` / `cargo check` / `pnpm build` pass on any host;
# the full pipeline compiles on Windows / windows-msvc check and on
# Linux (Flatpak runtime provides GStreamer + PipeWire).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
  "implement",
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"

# Linux capture (Portal ScreenCast + PipeWire) + GStreamer from the
# Flatpak runtime (or system packages on dev machines). Versions track
# the ezTopaz baseline: pipewire 0.8/libspa 0.8 no longer build on
# recent toolchains (bindgen emits an opaque spa_pod_builder).
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
ashpd = { version = "0.7", default-features = false, features = ["tokio"] }
pipewire = { version = "0.10", features = ["v1_0_0"] }
libspa = { version = "0.10" }
tokio = { version = "1", features = ["rt-multi-thread"] }
libc = "0.2"
