name: Release

on:
  push:
    tags: ['preview.*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'ezstreamer-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# PRの連続pushは旧実行をキャンセルして節約。タグはrefが一意のため実質影響なし
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release bundles NSIS with the GStreamer MSVC subset (design §13.2).
  # The runtime is LGPL — GSTREAMER-NOTICE.txt must ship with artifacts (§11).
  build:
    runs-on: windows-latest
    permissions:
      contents: write # タグ push 時に GitHub Release を作成/更新するため
    steps:
      - uses: actions/checkout@v4
        with:
          # リリース文の前バージョン比較 (PREV...TAG の git log) に全履歴+タグが必要
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install GStreamer MSVC runtime (pinned)
        shell: pwsh
        env:
          GSTREAMER_VERSION: "1.26.11"
          GSTREAMER_MSI: "gstreamer-1.0-msvc-x86_64-1.26.11.msi"
          GSTREAMER_DEV_MSI: "gstreamer-1.0-devel-msvc-x86_64-1.26.11.msi"
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/1.26.11/msvc"
          $ua = @{ "User-Agent" = "ezStreamer-CI/1.0" }
          Invoke-WebRequest "$base/$env:GSTREAMER_MSI" -OutFile "$env:TEMP/gst.msi" -Headers $ua
          Invoke-WebRequest "$base/$env:GSTREAMER_DEV_MSI" -OutFile "$env:TEMP/gst-dev.msi" -Headers $ua
          # 1619 guard: MSI must be a real OLE package, not an HTML error page
          foreach ($f in @("$env:TEMP/gst.msi", "$env:TEMP/gst-dev.msi")) {
            $size = (Get-Item $f).Length
            $magic = [System.BitConverter]::ToString([System.IO.File]::ReadAllBytes($f)[0..3])
            echo "$f size=$size magic=$magic"
            if ($size -lt 10MB -or $magic -ne "D0-CF-11-E0") {
              Get-Content $f -TotalCount 5 -ErrorAction SilentlyContinue
              throw "bad MSI download: $f"
            }
          }
          # Downloaded files carry Zone.Identifier (Mark of the Web);
          # msiexec refuses them with 1619 unless unblocked.
          Unblock-File "$env:TEMP/gst.msi", "$env:TEMP/gst-dev.msi"
          $rt = Start-Process msiexec -ArgumentList "/i", "$env:TEMP/gst.msi", "/quiet", "/norestart" -Wait -PassThru
          $dev = Start-Process msiexec -ArgumentList "/i", "$env:TEMP/gst-dev.msi", "/quiet", "/norestart" -Wait -PassThru
          if ($rt.ExitCode -ne 0 -or $dev.ExitCode -ne 0) { throw "msiexec failed: runtime=$($rt.ExitCode) devel=$($dev.ExitCode)" }
          # MSI default dir differs by version; resolve by probing for glib-2.0.pc
          $gstRoot = $null
          foreach ($c in @("C:\gstreamer\1.0\msvc_x86_64", "${env:ProgramFiles}\gstreamer\1.0\msvc_x86_64")) {
            if (Test-Path "$c\lib\pkgconfig\glib-2.0.pc") { $gstRoot = $c; break }
          }
          if (-not $gstRoot) {
            Get-ChildItem "C:\gstreamer", "${env:ProgramFiles}\gstreamer" -Recurse -Filter "glib-2.0.pc" -ErrorAction SilentlyContinue | Select-Object -First 3 FullName
            throw "glib-2.0.pc not found under known GStreamer roots"
          }
          echo "GStreamer root: $gstRoot"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" >> $env:GITHUB_ENV
          "$gstRoot\bin" >> $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig" >> $env:GITHUB_ENV
      - name: Install pkg-config (gstreamer-sys build script)
        run: choco install pkgconfiglite -y --no-progress
      - name: Stage bundled GStreamer subset (design §13.2)
        shell: pwsh
        run: |
          $gst = if ($env:GSTREAMER_1_0_ROOT_MSVC_X86_64) { $env:GSTREAMER_1_0_ROOT_MSVC_X86_64 } else { "C:\gstreamer\1.0\msvc_x86_64" }
          $dst = "src-tauri/resources/gstreamer"
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory "$dst/bin" -Force | Out-Null
          New-Item -ItemType Directory "$dst/lib/gstreamer-1.0" -Force | Out-Null
          # Core DLLs (+ glib/gobject/intl/ffi/pcre2/zlib/openssl runtime deps)
          Copy-Item "$gst/bin/gstreamer-1.0-0.dll","$gst/bin/gst*-1.0-0.dll" "$dst/bin/"
          Copy-Item "$gst/bin/glib-2.0-0.dll","$gst/bin/gobject-2.0-0.dll","$gst/bin/gmodule-2.0-0.dll" "$dst/bin/"
          Copy-Item "$gst/bin/intl-8.dll","$gst/bin/libffi-*.dll","$gst/bin/pcre2-*.dll","$gst/bin/zlib1.dll" "$dst/bin/" -ErrorAction SilentlyContinue
          Copy-Item "$gst/bin/libcrypto-*-x64.dll","$gst/bin/libssl-*-x64.dll" "$dst/bin/" -ErrorAction SilentlyContinue
          # Plugin allowlist: colorspace/scale, audio convert, mux/sink, encoders
          $plugins = @("gstapp","gstvideoconvertscale","gstvideofilter","gstaudioconvert","gstaudioresample",
            "gstflv","gstrtmp2","gstx264","gstopenh264","gstnvcodec","gstqsv","gstamfcodec","gstd3d11","gstwasapi2")
          foreach ($p in $plugins) {
            $f = Get-Item "$gst/lib/gstreamer-1.0/$p.dll" -ErrorAction SilentlyContinue
            if ($f) { Copy-Item $f "$dst/lib/gstreamer-1.0/" }
            else { Write-Host "NOTE: plugin not in runtime: $p" }
          }
          # LGPL provenance inside the bundle (design §11)
          @"
          Bundled GStreamer runtime provenance (generated at bundle time)
          GSTREAMER_VERSION=1.26.11
          Runtime: https://gstreamer.freedesktop.org/data/pkg/windows/1.26.11/msvc/gstreamer-1.0-msvc-x86_64-1.26.11.msi
          Devel:   https://gstreamer.freedesktop.org/data/pkg/windows/1.26.11/msvc/gstreamer-1.0-devel-msvc-x86_64-1.26.11.msi
          Sources: https://gitlab.freedesktop.org/gstreamer/gstreamer
          License: LGPL-2.1+ (see GSTREAMER-NOTICE.txt in resources/licenses)
          "@ | Out-File -Encoding utf8 "$dst/GSTREAMER-BUILD.txt"
      - name: Build NSIS bundle
        run: pnpm i && pnpm tauri build --bundles nsis
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          git fetch --tags --force
          # 1つ前の preview.* タグを特定し、差分をリリース文にする
          PREV=$(git tag --list 'preview.*' --sort=-v:refname | grep -vxF "$TAG" | head -n1)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$TAG"
            TITLE_SUFFIX=" ($PREV からの変更)"
            COMPARE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
          else
            RANGE="$TAG"
            TITLE_SUFFIX=""
            COMPARE="_First preview release._"
          fi
          pick() { git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' "$@" || true; }
          ADDED=$(pick --grep='^feat' -i)
          FIXED=$(pick --grep='^fix' -i)
          IMPROVED=$(pick --invert-grep --grep='^feat' --grep='^fix' -i)
          [ -n "$ADDED" ] || ADDED="- なし"
          [ -n "$FIXED" ] || FIXED="- なし"
          [ -n "$IMPROVED" ] || IMPROVED="- なし"
          cat > /tmp/release-notes.md <<EOF
          ## ezStreamer $TAG$TITLE_SUFFIX

          ### ✨ 追加 Added
          $ADDED

          ### 🔧 改善 Improved
          $IMPROVED

          ### 🐛 修正 Fixed
          $FIXED

          ---
          $COMPARE

          Windows-only preview build. GStreamer (LGPL) runtime subset is bundled — no separate install needed.
          EOF
          gh release create "$TAG" --title "ezStreamer $TAG" --notes-file /tmp/release-notes.md \
            target/release/bundle/nsis/*.exe
