name: Release

on:
  push:
    tags: ['preview.*']
  pull_request:
    paths:
      - 'ezstreamer-app/**'
      - 'ezstreamer-core/**'
      - 'packaging/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# PRの連続pushは旧実行をキャンセルして節約。タグはrefが一意のため実質影響なし
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release bundles NSIS with the GStreamer MSVC subset (design §13.2).
  # The runtime is LGPL — GSTREAMER-NOTICE.txt must ship with artifacts (§11).
  build:
    runs-on: windows-latest
    permissions:
      contents: write # タグ push 時に GitHub Release を作成/更新するため
    steps:
      - uses: actions/checkout@v4
        with:
          # リリース文の前バージョン比較 (PREV...TAG の git log) に全履歴+タグが必要
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GStreamer MSVC runtime (pinned)
        shell: pwsh
        env:
          GSTREAMER_VERSION: "1.28.6"
          GSTREAMER_EXE: "gstreamer-1.0-msvc-x86_64-1.28.6.exe"
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/1.28.6/msvc"
          $ua = @{ "User-Agent" = "ezStreamer-CI/1.0" }
          Invoke-WebRequest "$base/$env:GSTREAMER_EXE" -OutFile "$env:TEMP/gst.exe" -Headers $ua
          # EXE must be a real PE binary, not an HTML error page
          $size = (Get-Item "$env:TEMP/gst.exe").Length
          $magic = [System.BitConverter]::ToString([System.IO.File]::ReadAllBytes("$env:TEMP/gst.exe")[0..1])
          echo "gst.exe size=$size magic=$magic"
          if ($size -lt 10MB -or $magic -ne "4D-5A") { throw "bad installer download" }
          Unblock-File "$env:TEMP/gst.exe"
          # Inno Setup 6 (1.28+): single installer, /TYPE=devel = runtime+headers
          $p = Start-Process "$env:TEMP/gst.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=C:\gstreamer\1.0\msvc_x86_64", "/TYPE=devel", "/ALLUSERS" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GStreamer installer failed: $($p.ExitCode)" }
          # MSI default dir differs by version; resolve by probing for glib-2.0.pc
          $gstRoot = $null
          foreach ($c in @("C:\gstreamer\1.0\msvc_x86_64", "${env:ProgramFiles}\gstreamer\1.0\msvc_x86_64")) {
            if (Test-Path "$c\lib\pkgconfig\glib-2.0.pc") { $gstRoot = $c; break }
          }
          if (-not $gstRoot) {
            Get-ChildItem "C:\gstreamer", "${env:ProgramFiles}\gstreamer" -Recurse -Filter "glib-2.0.pc" -ErrorAction SilentlyContinue | Select-Object -First 3 FullName
            throw "glib-2.0.pc not found under known GStreamer roots"
          }
          echo "GStreamer root: $gstRoot"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" >> $env:GITHUB_ENV
          "$gstRoot\bin" >> $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig" >> $env:GITHUB_ENV
      - name: Install pkg-config (gstreamer-sys build script)
        run: choco install pkgconfiglite -y --no-progress
      - name: Stage bundled GStreamer subset (design §13.2)
        shell: pwsh
        run: |
          $gst = if ($env:GSTREAMER_1_0_ROOT_MSVC_X86_64) { $env:GSTREAMER_1_0_ROOT_MSVC_X86_64 } else { "C:\gstreamer\1.0\msvc_x86_64" }
          $dst = "ezstreamer-app/resources/gstreamer"
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory "$dst/bin" -Force | Out-Null
          New-Item -ItemType Directory "$dst/lib/gstreamer-1.0" -Force | Out-Null
          # Full bin/*.dll closure: the exe DELAYLOADs direct imports (glib/
          # gobject/gio/gstreamer/...) and Windows resolves transitive deps
          # (intl/ffi/pcre2/zlib/ssl/orc/...) from the loading DLL's dir +
          # AddDllDirectory. A hand-picked subset (preview.01) missed
          # gio/gthread/orc and broke clean machines at process startup.
          Copy-Item "$gst/bin/*.dll" "$dst/bin/"
          # Resolve pipeline plugins from the FULL runtime registry instead of a
          # hand-kept filename list (preview.03 guessed names and still missed
          # gstcoreelements, which provides capsfilter+queue).
          # For each element used by gst_stream.rs spawn_pipeline (+ encoder
          # variants), gst-inspect reports its plugin file; that exact file is
          # staged. A missing REQUIRED element throws here, never on user PCs.
          # File-based (not registry-based), so no system runtime can mask a
          # missing staged file.
          $inspect = "$gst/bin/gst-inspect-1.0.exe"
          if (-not (Test-Path $inspect)) { throw "gst-inspect not found in $gst/bin" }
          $plugindir = "$dst/lib/gstreamer-1.0"
          function Copy-PluginForElement([string]$elem) {
            $out = & $inspect $elem 2>$null
            if ($LASTEXITCODE -ne 0) { return $false }
            $m = ($out | Select-String -Pattern "^\s*Filename\s+(.+?)\s*$" | Select-Object -First 1)
            if (-not $m) { throw "cannot parse plugin filename for element: $elem" }
            $src = $m.Matches[0].Groups[1].Value.Trim()
            $dest = Join-Path $plugindir (Split-Path $src -Leaf)
            if (-not (Test-Path $dest)) { Copy-Item $src $dest | Out-Null }
            return $true
          }
          # Required: spawn_pipeline topology (appsrc x2, converters, parsers,
          # mux, sink) + libx264 software fallback.
          $requiredElements = @("appsrc","videoconvert","videoscale","capsfilter","queue",
            "x264enc","h264parse","audioconvert","audioresample","aacparse","flvmux","rtmp2sink")
          $missingElements = @()
          foreach ($e in $requiredElements) {
            if (Copy-PluginForElement $e) { Write-Host "  $e OK" }
            else { $missingElements += $e }
          }
          # x264 alternative + runtime-conditional elements. vulkanupload is
          # required by the Vulkan video leg (queue → vulkanupload → enc) and
          # lives in the same libgstvulkan as the encoder — staged explicitly
          # so a future split never drops it silently. (The official Windows
          # runtime does not build gstvulkan, so these stay absent in bundles.)
          foreach ($e in @("openh264enc","vah264enc","vaapih264enc","vulkanh264enc","vulkanupload")) {
            if (Copy-PluginForElement $e) { Write-Host "  $e OK (optional)" }
            else { Write-Host "  NOTE: full runtime lacks optional element: $e" }
          }
          # GPU-conditional HW encoders (nvcodec/qsv/amfcodec) register their
          # elements only when the matching device is present at scan time
          # (NVIDIA CUDA / Intel GPU / AMD GPU). The CI runner has none, so
          # `gst-inspect` cannot see them — an element-based copy silently
          # omitted their plugin DLLs from every bundle up to preview.07
          # (users saw "GStreamer plugin not installed" for all HW encoders).
          # Copy the plugin files by name instead: they load harmlessly and
          # register nothing on machines without that hardware. Their bin/
          # dependencies (gstcuda/gstd3d11/gstd3d12/gstgl/...) are part of the
          # wholesale bin/*.dll closure staged above.
          foreach ($p in @("gstnvcodec","gstqsv","gstamfcodec")) {
            $src = "$gst/lib/gstreamer-1.0/$p.dll"
            if (Test-Path $src) {
              Copy-Item $src $plugindir -Force | Out-Null
              Write-Host "  $p.dll OK (HW, file-based)"
            } else { Write-Host "NOTE: full runtime lacks optional plugin file: $p.dll" }
          }
          # AAC encoders: need at least one (find_aacenc tries in this order).
          $haveAac = $false
          foreach ($e in @("voaacenc","avenc_aac","mfaacenc")) {
            if (Copy-PluginForElement $e) { $haveAac = $true; Write-Host "  $e OK (AAC)" }
            else { Write-Host "  NOTE: no $e in full runtime" }
          }
          if (-not $haveAac) { throw "full runtime provides no AAC encoder (voaacenc/avenc_aac/mfaacenc)" }
          # Non-pipeline extras shipped since preview.01 (kept to avoid shrinkage).
          foreach ($p in @("gstvideofilter","gstd3d11","gstwasapi2")) {
            $f = Get-Item "$gst/lib/gstreamer-1.0/$p.dll" -ErrorAction SilentlyContinue
            if ($f) { Copy-Item $f $plugindir | Out-Null }
            else { Write-Host "NOTE: plugin not in runtime: $p" }
          }
          # Probing natives leave $LASTEXITCODE != 0 by design; GHA's pwsh fails
          # the step on a trailing non-zero code — reset explicitly.
          $LASTEXITCODE = 0
          if ($missingElements.Count -gt 0) { throw ("staged bundle lacks elements: " + ($missingElements -join ", ")) }
          Write-Host "staged plugin resolution OK"
          # Plugin scanner + preset/schemas helpers when present (registry update).
          foreach ($extra in @(
            @{ src = "$gst/bin/gst-plugin-scanner.exe"; dir = "$dst/bin" },
            @{ src = "$gst/libexec/gstreamer-1.0/gst-plugin-scanner.exe"; dir = "$dst/libexec/gstreamer-1.0" }
          )) {
            if (Test-Path $extra.src) {
              New-Item -ItemType Directory $extra.dir -Force | Out-Null
              Copy-Item $extra.src $extra.dir
            }
          }
          foreach ($share in @("share/glib-2.0/schemas", "share/gstreamer-1.0/presets")) {
            if (Test-Path "$gst/$share") {
              New-Item -ItemType Directory "$dst/$share" -Force | Out-Null
              Copy-Item "$gst/$share/*" "$dst/$share/" -Recurse -ErrorAction SilentlyContinue
            }
          }
          # Fail fast when the DELAYLOAD closure is incomplete.
          $required = @("gstreamer-1.0-0.dll","gstapp-1.0-0.dll","gstbase-1.0-0.dll",
            "gobject-2.0-0.dll","glib-2.0-0.dll","gio-2.0-0.dll","gmodule-2.0-0.dll","gthread-2.0-0.dll")
          foreach ($r in $required) {
            if (-not (Test-Path "$dst/bin/$r")) { throw "bundled runtime missing: $r" }
          }
          Get-ChildItem "$dst/bin/*.dll" | Measure-Object | ForEach-Object { echo "bundled bin DLLs: $($_.Count)" }
          Get-ChildItem "$dst/lib/gstreamer-1.0/*.dll" | Measure-Object | ForEach-Object { echo "bundled plugins: $($_.Count)" }
          # LGPL provenance inside the bundle (design §11)
          @"
          Bundled GStreamer runtime provenance (generated at bundle time)
          GSTREAMER_VERSION=1.28.6
          Runtime: https://gstreamer.freedesktop.org/data/pkg/windows/1.28.6/msvc/gstreamer-1.0-msvc-x86_64-1.28.6.exe
          Devel:   https://gstreamer.freedesktop.org/data/pkg/windows/1.28.6/msvc/gstreamer-1.0-msvc-x86_64-1.28.6.exe
          Sources: https://gitlab.freedesktop.org/gstreamer/gstreamer
          License: LGPL-2.1+ (see GSTREAMER-NOTICE.txt in resources/licenses)
          "@ | Out-File -Encoding utf8 "$dst/GSTREAMER-BUILD.txt"
      - name: Build release binary
        run: cargo build --release -p ezstreamer
      - name: Verify GStreamer DLLs are delay-loaded (clean-machine startup)
        shell: pwsh
        run: |
          # preview.10 regression: ezstreamer-app/build.rs was lost in the
          # egui migration, so the loader resolved gstreamer-rs imports at
          # process startup and clean machines failed before main() with
          # "gobject-2.0-0.dll" / "gstreamer-1.0-0.dll" not found. /DELAYLOAD
          # keeps the bundled DLLs out of the static import table; fail the
          # bundle if the build script disappears again.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found" }
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          $dependents = & $dumpbin /nologo /dependents target\release\ezstreamer.exe | Out-String
          Write-Host $dependents
          $mustDelay = @("glib-2.0-0.dll","gthread-2.0-0.dll","gmodule-2.0-0.dll",
            "gobject-2.0-0.dll","gio-2.0-0.dll","gstreamer-1.0-0.dll",
            "gstbase-1.0-0.dll","gstapp-1.0-0.dll")
          $static = @($mustDelay | Where-Object { $dependents -match [regex]::Escape($_) })
          if ($static.Count -gt 0) { throw ("not delay-loaded (static imports): " + ($static -join ", ")) }
          Write-Host "OK: no GStreamer DLLs in the static import table"
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build NSIS installer
        shell: pwsh
        run: |
          # Version comes from Cargo.toml (single source of truth).
          $version = (Select-String -Path ezstreamer-app/Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          echo "version=$version"
          New-Item -ItemType Directory dist -Force | Out-Null
          # Chocolatey does not refresh PATH in the running job; resolve the
          # makensis path explicitly.
          $nsis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $nsis = $cmd.Source }
          }
          if (-not $nsis) { throw "makensis not found after choco install nsis" }
          # Absolute paths: NSIS resolves relative File/OutFile paths against
          # the invoking cwd, not the script directory.
          & $nsis "/DAPP_VERSION=$version" "/DSRC_DIR=$PWD\target\release" "/DRES_DIR=$PWD\ezstreamer-app\resources" "/DOUT_FILE=$PWD\dist\ezStreamer-$version-setup.exe" "/DICON_FILE=$PWD\ezstreamer-app\icons\icon.ico" packaging\windows\ezstreamer.nsi
          if (-not (Test-Path "dist/ezStreamer-$version-setup.exe")) { throw "installer was not produced" }
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          git fetch --tags --force
          # 1つ前の preview.* タグを特定し、差分をリリース文にする
          PREV=$(git tag --list 'preview.*' --sort=-v:refname | grep -vxF "$TAG" | head -n1 || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$TAG"
            TITLE_SUFFIX=" ($PREV からの変更)"
            COMPARE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
          else
            RANGE="$TAG"
            TITLE_SUFFIX=""
            COMPARE="_First preview release._"
          fi
          pick() { git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' "$@" || true; }
          ADDED=$(pick --grep='^feat' -i)
          FIXED=$(pick --grep='^fix' -i)
          IMPROVED=$(pick --invert-grep --grep='^feat' --grep='^fix' -i)
          [ -n "$ADDED" ] || ADDED="- なし"
          [ -n "$FIXED" ] || FIXED="- なし"
          [ -n "$IMPROVED" ] || IMPROVED="- なし"
          cat > /tmp/release-notes.md <<EOF
          ## ezStreamer $TAG$TITLE_SUFFIX

          ### ✨ 追加 Added
          $ADDED

          ### 🔧 改善 Improved
          $IMPROVED

          ### 🐛 修正 Fixed
          $FIXED

          ---
          $COMPARE

          Windows preview build (NSIS, native egui UI, GStreamer LGPL subset bundled) + Linux Flatpak (GNOME runtime).
          EOF
          gh release create "$TAG" --title "ezStreamer $TAG" --notes-file /tmp/release-notes.md \
            dist/*.exe

  # Linux Flatpak (GNOME runtime carries GStreamer + PipeWire + GL).
  # PRs build to verify the manifest; tags bundle + attach the .flatpak to
  # the same GitHub Release (created by the Windows job — upload retries
  # until it exists).
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install flatpak toolchain + GNOME SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.llvm21//25.08
      - name: Vendor Rust crates (flatpak build sandbox is offline)
        run: |
          mkdir -p .cargo
          cargo vendor >> .cargo/config.toml
      - name: Build Flatpak
        run: |
          sudo flatpak-builder --force-clean --repo=repo build-dir \
            packaging/flatpak/app.ezstreamer.desktop.yaml
      - name: Bundle + attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          sudo flatpak build-bundle repo "ezstreamer-${TAG}-x86_64.flatpak" app.ezstreamer.desktop
          sudo chown "$(id -u):$(id -g)" "ezstreamer-${TAG}-x86_64.flatpak"
          # The Windows job creates the release; wait for it before uploading.
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 30
          done
          gh release upload "$TAG" "ezstreamer-${TAG}-x86_64.flatpak" --clobber
