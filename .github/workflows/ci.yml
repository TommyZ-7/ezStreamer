name: CI

on:
  # PRでは常時起動する。docsのみ変更の場合は changes ジョブが検出して
  # 高速パス (即green) にする。paths-ignore を付けると
  # 必須チェックが "Expected" のまま詰まるため付けないこと。
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - 'src-tauri/resources/gstreamer/README.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"
          echo "$FILES"
          if [ -z "$FILES" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$FILES" | grep -qvE '(^docs/|\.md$|(^|/)LICENSE$|^src-tauri/resources/gstreamer/README\.txt$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change, skipping heavy checks."
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.docs_only != 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.docs_only != 'true'
        with: { version: 10 }
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs_only != 'true'
        with: { node-version: 22, cache: pnpm }
      - name: Install GStreamer MSVC runtime (pinned)
        if: needs.changes.outputs.docs_only != 'true'
        shell: pwsh
        env:
          GSTREAMER_VERSION: "1.28.6"
          GSTREAMER_EXE: "gstreamer-1.0-msvc-x86_64-1.28.6.exe"
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/1.28.6/msvc"
          $ua = @{ "User-Agent" = "ezStreamer-CI/1.0" }
          Invoke-WebRequest "$base/$env:GSTREAMER_EXE" -OutFile "$env:TEMP/gst.exe" -Headers $ua
          # EXE must be a real PE binary, not an HTML error page
          $size = (Get-Item "$env:TEMP/gst.exe").Length
          $magic = [System.BitConverter]::ToString([System.IO.File]::ReadAllBytes("$env:TEMP/gst.exe")[0..1])
          echo "gst.exe size=$size magic=$magic"
          if ($size -lt 10MB -or $magic -ne "4D-5A") { throw "bad installer download" }
          Unblock-File "$env:TEMP/gst.exe"
          # Inno Setup 6 (1.28+): single installer, /TYPE=devel = runtime+headers
          $p = Start-Process "$env:TEMP/gst.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=C:\gstreamer\1.0\msvc_x86_64", "/TYPE=devel", "/ALLUSERS" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GStreamer installer failed: $($p.ExitCode)" }
          # MSI default dir differs by version; resolve by probing for glib-2.0.pc
          $gstRoot = $null
          foreach ($c in @("C:\gstreamer\1.0\msvc_x86_64", "${env:ProgramFiles}\gstreamer\1.0\msvc_x86_64")) {
            if (Test-Path "$c\lib\pkgconfig\glib-2.0.pc") { $gstRoot = $c; break }
          }
          if (-not $gstRoot) {
            Get-ChildItem "C:\gstreamer", "${env:ProgramFiles}\gstreamer" -Recurse -Filter "glib-2.0.pc" -ErrorAction SilentlyContinue | Select-Object -First 3 FullName
            throw "glib-2.0.pc not found under known GStreamer roots"
          }
          echo "GStreamer root: $gstRoot"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" >> $env:GITHUB_ENV
          "$gstRoot\bin" >> $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig" >> $env:GITHUB_ENV
      - name: Install pkg-config (gstreamer-sys build script)
        if: needs.changes.outputs.docs_only != 'true'
        run: choco install pkgconfiglite -y --no-progress
      - name: Core tests
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test -p ezstreamer-core
      - name: Check backend (Windows + GStreamer)
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo check -p ezstreamer
      - name: Frontend
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm i && pnpm build && pnpm test

  # Linux build gate: the Flatpak backend (Portal + PipeWire + GStreamer
  # from system packages here, from the GNOME runtime in the Flatpak).
  linux:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change, skipping heavy checks."
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.docs_only != 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.docs_only != 'true'
        with: { version: 10 }
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs_only != 'true'
        with: { node-version: 22, cache: pnpm }
      - name: Install system dependencies (Tauri + GStreamer + PipeWire)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev
      - name: Core tests
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test -p ezstreamer-core
      - name: Check backend (Linux + GStreamer + PipeWire)
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo check -p ezstreamer --tests
      - name: Backend tests (PipeWire fail-fast paths; no daemon on runner)
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test -p ezstreamer
      - name: Frontend
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm i && pnpm build && pnpm test
